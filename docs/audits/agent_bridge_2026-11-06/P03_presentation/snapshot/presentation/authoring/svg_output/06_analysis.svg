<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Arial" data-pptx-page-role="ending"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background" id="page-background" /><g id="header" data-pptx-bounds="64 32 1152 108" font-weight="700"><text x="64" y="55" font-size="20" fill="#245DB5">COMS6998  /  ANALYSIS · P2 PLAN</text><text x="64" y="119" font-size="44" fill="#132A49">Next: remove the ceiling, then test attribution</text></g><g id="interpretation" data-pptx-bounds="64 154 1152 95"><text x="64" y="191" font-size="36" fill="#132A49" font-weight="700"><tspan x="64" y="191">A working pipeline does not yet establish</tspan><tspan x="64" y="237">a general E-graph advantage.</tspan></text></g><g id="planning-limits" data-pptx-bounds="64 568 1152 45"><text x="64" y="596" font-size="20" fill="#5D6B7C">Proposed for Nov 9 P2; R0/R1/R2 recovery comparisons remain planned.</text></g><g id="feedback-request" data-pptx-bounds="64 617 1152 32"><rect x="64" y="617" width="1152" height="32" fill="#F4F7FC" /><text x="80" y="640" font-size="24" fill="#245DB5" font-weight="700">Feedback: prioritize temporal completion, or a semantics-only ablation?</text></g><g id="footer" data-pptx-bounds="64 662 1152 38"><line x1="64" y1="662" x2="1216" y2="662" stroke="#D8E1EC" stroke-width="1" /><text x="64" y="690" font-size="16" fill="#5D6B7C">Implemented: frozen generation, independent grading, mock/replay and explicit coverage / cost evidence</text><text x="1216" y="690" font-size="16" fill="#5D6B7C" text-anchor="end">06 / 06</text></g><g id="proposed-step-1" data-pptx-bounds="64 294 1152 76"><text x="64" y="318" font-size="28" fill="#008B8B" font-weight="700">01</text><text x="140" y="318" font-size="28" fill="#132A49" font-weight="700">Unsaturated temporal obligations</text><text x="140" y="355" font-size="24" fill="#5D6B7C">Use held-out cases that separate safety from finite completion.</text></g><g id="proposed-step-2" data-pptx-bounds="64 390 1152 76"><text x="64" y="414" font-size="28" fill="#008B8B" font-weight="700">02</text><text x="140" y="414" font-size="28" fill="#132A49" font-weight="700">Token-matched placebo</text><text x="140" y="451" font-size="24" fill="#5D6B7C">Separate semantic value from extra feedback and token spend.</text></g><g id="proposed-step-3" data-pptx-bounds="64 486 1152 76"><text x="64" y="510" font-size="28" fill="#008B8B" font-weight="700">03</text><text x="140" y="510" font-size="28" fill="#132A49" font-weight="700">Qualify formal-to-physical mapping</text><text x="140" y="547" font-size="24" fill="#5D6B7C">Resolve four-state representation limits; retain unknowns.</text></g></svg>
