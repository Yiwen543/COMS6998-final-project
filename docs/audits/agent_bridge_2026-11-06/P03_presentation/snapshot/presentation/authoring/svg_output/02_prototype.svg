<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Arial" data-pptx-page-role="content"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background" id="page-background"/><g id="header" data-pptx-bounds="64 32 1152 108" font-weight="700"><text x="64" y="55" font-size="20" fill="#245DB5">COMS6998  /  IMPLEMENTATION</text><text x="64" y="119" font-size="44" fill="#132A49">One tool loop, two verification tasks</text></g><g id="semantic-branch" data-pptx-bounds="64 395 1152 64"><rect x="64" y="395" width="1152" height="64" fill="#F4F7FC"/><text x="84" y="435" font-size="24" fill="#008B8B" font-weight="700">C adds: typed guards &#8594; restricted E-graph groups &#8594; Z3 equivalence checks</text></g><g id="stimulus-track" data-pptx-bounds="64 483 1152 43"><text x="64" y="510" font-size="20" fill="#245DB5" font-weight="700">TRACK S</text><text x="250" y="510" font-size="28" fill="#132A49">Generate stimuli; measure real RTL coverage.</text></g><g id="monitor-track" data-pptx-bounds="64 537 1152 43"><text x="64" y="564" font-size="20" fill="#008B8B" font-weight="700">TEST2</text><text x="250" y="564" font-size="28" fill="#132A49">Fix stimuli; generate monitors; detect hidden faults.</text></g><g id="independence-limit" data-pptx-bounds="64 588 1152 50"><text x="64" y="615" font-size="20" fill="#5D6B7C">Claude reference &#8800; GPT candidate. Two-state guard proof &#8800; sequential / four-state proof.</text></g><g id="footer" data-pptx-bounds="64 662 1152 38"><line x1="64" y1="662" x2="1216" y2="662" stroke="#D8E1EC" stroke-width="1"/><text x="64" y="690" font-size="16" fill="#5D6B7C">Sources: workflow + experiment protocol; restricted semantics and independent reference retained</text><text x="1216" y="690" font-size="16" fill="#5D6B7C" text-anchor="end">02 / 06</text></g><g id="prototype-lead" data-pptx-bounds="64 145 1152 42"><text x="64" y="170" font-size="24" fill="#5D6B7C">Implemented protot