<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Arial" data-pptx-page-role="content"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background" id="page-background" /><g id="header" data-pptx-bounds="64 32 1152 108" font-weight="700"><text x="64" y="55" font-size="20" fill="#245DB5">COMS6998  /  METHODOLOGY</text><text x="64" y="119" font-size="44" fill="#132A49">B and C differ in feedback, not the test bench</text></g><g id="invariants" data-pptx-bounds="64 405 1152 92"><text x="64" y="434" font-size="20" fill="#245DB5" font-weight="700">SAME</text><text x="185" y="434" font-size="28" fill="#132A49">DUT · Claude checker · stimuli · gpt-6.1-sol / low</text><text x="185" y="476" font-size="24" fill="#5D6B7C">3 sessions / arm × 6 rounds · 64k input / 8192 output caps</text></g><g id="freeze" data-pptx-bounds="64 511 1152 67"><rect x="64" y="511" width="1152" height="67" fill="#F4F7FC" /><text x="88" y="554" font-size="24" fill="#132A49" font-weight="700">Generate 36 candidates</text><text x="471" y="554" font-size="24" fill="#132A49" font-weight="700">Freeze every round</text><text x="871" y="554" font-size="24" fill="#132A49" font-weight="700">Hidden grading</text><line x1="377" y1="546" x2="437" y2="546" stroke="#245DB5" stroke-width="2" /><line x1="748" y1="546" x2="834" y2="546" stroke="#245DB5" stroke-width="2" /></g><g id="isolation-limit" data-pptx-bounds="64 589 1152 65"><text x="64" y="614" font-size="20" fill="#5D6B7C"><tspan x="64" y="614">No hidden faults, evaluation traces or reference code in prompts.</tspan><tspan x="64" y="641">Equal caps ≠ equal actual tokens; no token-matched placebo in this cohort.</tspan></text></g><g id="footer" data-pptx-bounds="64 662 1152 38"><line x1="64" y1="662" x2="1216" y2="662" stroke="#D8E1EC" stroke-width="1" /><text x="64" y="690" font-size="16" fill="#5D6B7C">Preregistered configuration + prompt hashes + frozen candidates + saved grading / usage evidence</text><text x="1216" y="690" font-size="16" fill="#5D6B7C" text-anchor="end">03 / 06</text></g><g id="method-lead" data-pptx-bounds="64 145 1152 42"><text x="64" y="170" font-size="24" fill="#5D6B7C">Latest test2 cohort · fixed-stimulus passive monitor generation</text></g><g id="arm-b" data-pptx-bounds="64 211 560 176"><rect x="64" y="211" width="560" height="176" fill="#F4F7FC" /><rect x="64" y="211" width="6" height="176" fill="#245DB5" /><text x="90" y="258" font-size="44" fill="#245DB5" font-weight="700">B</text><text x="158" y="256" font-size="28" fill="#132A49" font-weight="700">Raw feedback</text><text x="158" y="307" font-size="28" fill="#132A49"><tspan x="158" y="307">Raw coverage + shared</tspan><tspan x="158" y="345">development feedback</tspan></text></g><g id="arm-c" data-pptx-bounds="656 211 560 176"><rect x="656" y="211" width="560" height="176" fill="#F4F7FC" /><rect x="656" y="211" width="6" height="176" fill="#008B8B" /><text x="682" y="258" font-size="44" fill="#008B8B" font-weight="700">C</text><text x="750" y="256" font-size="28" fill="#132A49" font-weight="700">Semantic feedback</text><text x="750" y="307" font-size="28" fill="#132A49"><tspan x="750" y="307">Everything in B + verified</tspan><tspan x="750" y="345">E-graph guard groups</tspan></text></g></svg>
