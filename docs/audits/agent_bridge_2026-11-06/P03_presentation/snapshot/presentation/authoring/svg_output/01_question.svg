<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Arial" data-pptx-page-role="cover"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background" id="page-background" /><rect x="1004" y="0" width="276" height="720" fill="#F4F7FC" data-pptx-role="background" id="cover-side-field" /><rect x="64" y="92" width="68" height="6" fill="#245DB5" data-pptx-role="decoration" id="cover-accent" /><g id="research-question" data-pptx-bounds="64 138 1152 166"><text x="64" y="195" font-size="64" fill="#132A49" font-weight="700"><tspan x="64" y="195">Can semantic feedback</tspan><tspan x="64" y="271">improve RTL verification?</tspan></text></g><g id="proposal" data-pptx-bounds="68 317 1100 88"><text x="68" y="346" font-size="28" fill="#132A49"><tspan x="68" y="346">Use verified E-graph groups to make</tspan><tspan x="68" y="384">LLM verification feedback more actionable.</tspan></text></g><g id="scope" data-pptx-bounds="68 558 1150 40"><text x="68" y="580" font-size="20" fill="#5D6B7C">Coverage ≠ correctness. Semantic classes ≠ RTL coverage points.</text></g><g id="footer" data-pptx-bounds="64 662 1152 38"><line x1="64" y1="662" x2="1216" y2="662" stroke="#D8E1EC" stroke-width="1" /><text x="64" y="690" font-size="16" fill="#5D6B7C">Proposal → prototype → controlled experiments → preliminary evidence</text><text x="1216" y="690" font-size="16" fill="#5D6B7C" text-anchor="end">01 / 06</text></g><g id="course-kicker" data-pptx-bounds="64 32 1152 40"><text x="64" y="55" font-size="20" fill="#245DB5" font-weight="700">COMS6998  /  MIDTERM · NOV 6</text></g><g id="objective-1" data-pptx-bounds="68 437 300 105"><line x1="68" y1="441" x2="354" y2="441" stroke="#D8E1EC" stroke-width="2" /><text x="68" y="482" font-size="28" fill="#245DB5" font-weight="700">01</text><text x="68" y="524" font-size="28" fill="#132A49">Coverage efficiency</text></g><g id="objective-2" data-pptx-bounds="440 437 300 105"><line x1="440" y